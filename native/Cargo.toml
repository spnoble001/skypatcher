[package]
name = "perfectpatch_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
jni = "0.21"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
